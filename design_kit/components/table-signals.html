<!doctype html><html><head><meta charset="utf-8"><title>Signals table</title><style>
body{margin:0;background:#1C2026;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;padding:24px;color:#ECEEF1}
.card{background:#272D36;border:1px solid #414957;border-radius:12px;padding:16px 18px}
h3{margin:0 0 10px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:#8A8F96;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:6px 10px;border-bottom:1px solid #414957}
td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#CBD0D7}
td.mkt{color:#ECEEF1;font-weight:600}
.num{font-family:Consolas,monospace;text-align:right}
th.num{text-align:right}
.pill{font-size:11px;font-weight:650;border-radius:20px;padding:2px 10px}
.long{background:rgba(70,197,138,.16);color:#46C58A;border:1px solid rgba(70,197,138,.4)}
.short{background:rgba(236,106,87,.16);color:#EC6A57;border:1px solid rgba(236,106,87,.4)}
.new{font-size:10px;background:rgba(245,197,24,.14);color:#F5C518;border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:700}
</style></head><body>
<div class="card"><h3>🔬 Technical opportunities</h3>
<table>
<tr><th>Market</th><th>Strategy</th><th>Signal</th><th class="num">Level</th><th class="num">Objective</th><th class="num">Risk to stop</th><th class="num">Conviction</th></tr>
<tr><td class="mkt">Gold</td><td>MA crossover</td><td><span class="pill long">Long</span><span class="new">NEW</span></td><td class="num">2412.60</td><td class="num">2488.00</td><td class="num">−1.8%</td><td class="num">82</td></tr>
<tr><td class="mkt">US 10Y Note (yield)</td><td>Trend</td><td><span class="pill short">Short · sell the bond</span></td><td class="num">4.235</td><td class="num">4.480</td><td class="num">−0.9%</td><td class="num">77</td></tr>
<tr><td class="mkt">Brent Crude</td><td>Breakout retest</td><td><span class="pill long">Long</span></td><td class="num">84.15</td><td class="num">88.60</td><td class="num">−2.3%</td><td class="num">71</td></tr>
<tr><td class="mkt">3M SOFR (rate)</td><td>Bollinger</td><td><span class="pill short">Short</span></td><td class="num">4.690</td><td class="num">4.905</td><td class="num">−0.6%</td><td class="num">64</td></tr>
</table></div>
</body></html>
