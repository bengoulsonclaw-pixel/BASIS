<!doctype html><html><head><meta charset="utf-8"><title>Masthead</title><style>
body{margin:0;background:#1C2026;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;padding:24px}
.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #414957;padding-bottom:14px}
.lock{display:flex;align-items:center;gap:14px}
.mark{width:40px;height:40px}
.stack .word{font-weight:800;font-size:30px;line-height:1;background:linear-gradient(90deg,#EEF0F3,#C0C5CC 50%,#CBA53C 72%,#F4CC3A);-webkit-background-clip:text;background-clip:text;color:transparent}
.stack .tag{font-size:9.5px;color:#8A8F96;letter-spacing:.38em;text-transform:uppercase;margin-top:3px}
.right{display:flex;align-items:center;gap:12px}
.badge{font-size:12px;color:#1A1A1A;background:#F5C518;border-radius:6px;padding:3px 10px;font-weight:650}
.toggle{width:34px;height:34px;border-radius:8px;background:#454D5A;border:1px solid #57606E;color:#ECEEF1;display:grid;place-items:center;font-size:15px;cursor:pointer}
.asof{font-size:12px;color:#CBD0D7}
</style></head><body>
<div class="mast">
  <div class="lock">
    <svg class="mark" viewBox="0 0 100 100"><line x1="8" y1="6" x2="8" y2="94" stroke="#8A8F96" stroke-width="3"/><path d="M20 20 L58 50 L20 80" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 20 L54 50 L92 80" fill="none" stroke="#9CA2A9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6D24A"/><stop offset="1" stop-color="#D9971C"/></linearGradient></defs></svg>
    <div class="stack"><div class="word">BASIS</div><div class="tag">Analysis · Strategy · Indicators</div></div>
  </div>
  <div class="right"><span class="asof">Signals as of 9:47 PM ET · 25 Jul 2026</span><span class="badge">RESEARCH MONITOR</span><div class="toggle">☀️</div></div>
</div>
</body></html>
