# BASIS — house theme (Analysis · Strategies · Indicators).
# This block is the DARK default: it paints the app on-brand before the app's
# own CSS loads. The in-app sun/moon toggle re-skins to light at runtime
# (see src/brand.py). primaryColor drives the active strategy button, the
# "Generate PDF" buttons, checkboxes, sliders and focus highlights.
[theme]
base = "dark"
primaryColor = "#F5C518"
backgroundColor = "#1C2026"
secondaryBackgroundColor = "#272D36"
textColor = "#ECEEF1"
font = "sans serif"

[server]
# Serves ./static/* at /app/static/* — used for the PWA manifest + its icons
# (brand.apply() injects the <link rel="manifest"> into <head>), so Chrome can
# offer a real "Install BASIS" with its own cached icon instead of a plain tab.
enableStaticServing = true
# Re-run open sessions automatically when a source file changes, instead of waiting
# for the user to click "Rerun" — page (app.py) edits then show up on their own.
# NB: src/ ENGINE changes still need a full relaunch (close the BASIS window and
# double-click run_dashboard.bat) — Python caches imported modules regardless.
runOnSave = true
